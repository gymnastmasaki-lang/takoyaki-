<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>スーパー管理画面 - 店舗管理</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out;
        }
        
        .animate-slideUp {
            animation: slideUp 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase初期化 -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, getDoc, addDoc, onSnapshot, updateDoc, deleteDoc, doc, setDoc, query, where, Timestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBoSdfEkez-b3P0BUHtowxCrTw-yEBdHSg",
            authDomain: "takoyaki-order-system-bacd7.firebaseapp.com",
            projectId: "takoyaki-order-system-bacd7",
            storageBucket: "takoyaki-order-system-bacd7.firebasestorage.app",
            messagingSenderId: "104494752890",
            appId: "1:104494752890:web:c0a25d62f42ffca01687c3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        window.db = db;
        window.storage = storage;
        window.auth = auth;
        window.firebaseModules = { 
            collection, getDocs, getDoc, addDoc, onSnapshot, 
            updateDoc, deleteDoc, doc, setDoc, query, where, Timestamp,
            ref, uploadBytes, getDownloadURL, signInAnonymously
        };

        // ★追加: 応急処置としてFirebase Authの匿名認証を実際に確立する。
        // これまでauthはimportされているだけで一度も呼ばれておらず、
        // Firestoreへのアクセスがセキュリティルール「if true」だけに
        // 依存していた。ここでログインを確立してから画面を表示することで、
        // ルールを「request.auth != null」に強化しても壊れないようにする。
        try {
            await signInAnonymously(auth);
        } catch (e) {
            console.error('❌ 匿名認証に失敗しました:', e);
            window.FirebaseAuthError = e;
        }

        window.FirebaseReady = true;
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // スーパー管理者パスワード（本番環境では環境変数などで管理）
        const SUPER_ADMIN_PASSWORD = 'SUPER2025ADMIN';

        // カスタムモーダルコンポーネント
        const CustomModal = ({ isOpen, onClose, type, title, message }) => {
            if (!isOpen) return null;
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️',
                confirm: '❓'
            };
            
            const colors = {
                success: 'from-green-500 to-green-600',
                error: 'from-red-500 to-red-600',
                warning: 'from-yellow-500 to-yellow-600',
                info: 'from-blue-500 to-blue-600',
                confirm: 'from-purple-500 to-purple-600'
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 animate-fadeIn">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full animate-slideUp">
                        <div className="text-center">
                            <div className="text-6xl mb-4">{icons[type] || icons.info}</div>
                            <h3 className="text-2xl font-bold text-gray-800 mb-4">{title}</h3>
                            <p className="text-gray-600 mb-6 whitespace-pre-line">{message}</p>
                            <button
                                onClick={onClose}
                                className={`w-full bg-gradient-to-r ${colors[type] || colors.info} text-white py-3 rounded-lg font-bold hover:opacity-90 transition-all`}
                            >
                                OK
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 確認モーダルコンポーネント
        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, message }) => {
            if (!isOpen) return null;
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 animate-fadeIn">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full animate-slideUp">
                        <div className="text-center">
                            <div className="text-6xl mb-4">❓</div>
                            <h3 className="text-2xl font-bold text-gray-800 mb-4">{title}</h3>
                            <p className="text-gray-600 mb-6 whitespace-pre-line">{message}</p>
                            <div className="flex gap-3">
                                <button
                                    onClick={onClose}
                                    className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-400 transition-all"
                                >
                                    キャンセル
                                </button>
                                <button
                                    onClick={() => {
                                        onConfirm();
                                        onClose();
                                    }}
                                    className="flex-1 bg-gradient-to-r from-red-500 to-red-600 text-white py-3 rounded-lg font-bold hover:opacity-90 transition-all"
                                >
                                    確認
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SuperAdminSystem = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [stores, setStores] = useState([]);
            const [showAddStore, setShowAddStore] = useState(false);
            const [editingStore, setEditingStore] = useState(null);
            const [formData, setFormData] = useState({
                storeName: '',
                storePassword: '',
                isActive: true,
                createMode: 'new',  // 'new' または 'copy'
                sourceStoreId: ''   // コピー元店舗ID
            });
            
            // モーダル用のstate
            const [modal, setModal] = useState({ isOpen: false, type: 'info', title: '', message: '' });
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: () => {} });
            const [showCopyDialog, setShowCopyDialog] = useState(false);  // コピー元選択ダイアログ
            // 🆕 パスワード管理
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [newSuperPassword, setNewSuperPassword] = useState('');
            const [confirmSuperPassword, setConfirmSuperPassword] = useState('');
            const [currentPasswordInput, setCurrentPasswordInput] = useState('');
            
            // 🆕 日計表出力用のstate
            const [showDailyReportModal, setShowDailyReportModal] = useState(false);
            const [selectedStore, setSelectedStore] = useState(null);
            const [reportYear, setReportYear] = useState(new Date().getFullYear());
            const [reportMonth, setReportMonth] = useState(new Date().getMonth() + 1);
            const [reportDay, setReportDay] = useState(new Date().getDate());
            
            // カスタムアラート関数
            const showAlert = (type, title, message) => {
                setModal({ isOpen: true, type, title, message });
            };
            
            // カスタム確認ダイアログ関数
            const showConfirm = (title, message, onConfirm) => {
                setConfirmModal({ isOpen: true, title, message, onConfirm });
            };

            // 店舗一覧を読み込み
            useEffect(() => {
                if (!isAuthenticated) return;

                const loadStores = async () => {
                    const { collection, onSnapshot } = window.firebaseModules;
                    const storesRef = collection(window.db, 'stores');
                    
                    onSnapshot(storesRef, (snapshot) => {
                        const storesList = [];
                        snapshot.forEach((doc) => {
                            storesList.push({ id: doc.id, ...doc.data() });
                        });
                        setStores(storesList);
                    });
                };

                loadStores();
            }, [isAuthenticated]);

            // ログイン処理（Firebaseでパスワード照合）
            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    const { doc, getDoc } = window.firebaseModules;
                    const configRef = doc(window.db, 'system_config', 'super_admin');
                    const snap = await getDoc(configRef);
                    let correctPassword = 'Kfrp8358@'; // 初期パスワード
                    if (snap.exists() && snap.data().password) {
                        correctPassword = snap.data().password;
                    }
                    if (passwordInput === correctPassword) {
                        setIsAuthenticated(true);
                        sessionStorage.setItem('superAdminAuth', 'true');
                    } else {
                        showAlert('error', 'エラー', 'パスワードが正しくありません');
                        setPasswordInput('');
                    }
                } catch(err) {
                    showAlert('error', 'エラー', 'ログインに失敗しました: ' + err.message);
                }
            };

            // スーパー管理者パスワード変更
            const handleChangeSuperPassword = async () => {
                if (!currentPasswordInput || !newSuperPassword || !confirmSuperPassword) {
                    showAlert('warning', '入力エラー', 'すべての項目を入力してください');
                    return;
                }
                if (newSuperPassword !== confirmSuperPassword) {
                    showAlert('error', 'エラー', '新しいパスワードが一致しません');
                    return;
                }
                if (newSuperPassword.length < 8) {
                    showAlert('warning', '入力エラー', 'パスワードは8文字以上にしてください');
                    return;
                }
                try {
                    const { doc, getDoc, setDoc } = window.firebaseModules;
                    const configRef = doc(window.db, 'system_config', 'super_admin');
                    const snap = await getDoc(configRef);
                    let correctPassword = 'Kfrp8358@';
                    if (snap.exists() && snap.data().password) {
                        correctPassword = snap.data().password;
                    }
                    if (currentPasswordInput !== correctPassword) {
                        showAlert('error', 'エラー', '現在のパスワードが正しくありません');
                        return;
                    }
                    await setDoc(configRef, { password: newSuperPassword, updatedAt: new Date().toISOString() }, { merge: true });
                    setShowPasswordModal(false);
                    setCurrentPasswordInput('');
                    setNewSuperPassword('');
                    setConfirmSuperPassword('');
                    showAlert('success', '変更完了', 'パスワードを変更しました。次回ログインから新しいパスワードが必要です。');
                } catch(err) {
                    showAlert('error', 'エラー', 'パスワード変更に失敗しました: ' + err.message);
                }
            };

            // 店舗追加
            const handleAddStore = async (e) => {
                e.preventDefault();
                
                if (!formData.storeName || !formData.storePassword) {
                    showAlert('warning', '入力エラー', '店舗名とパスワードを入力してください');
                    return;
                }
                
                if (formData.createMode === 'copy' && !formData.sourceStoreId) {
                    showAlert('warning', '選択エラー', 'コピー元の店舗を選択してください');
                    return;
                }

                try {
                    const { collection, setDoc, doc, Timestamp, getDocs } = window.firebaseModules;
                    
                    // 店舗IDを生成（店舗名をベースにした安全なID）
                    const storeId = formData.storeName.replace(/\s+/g, '_').toLowerCase();
                    
                    const storeData = {
                        storeName: formData.storeName,
                        storePassword: formData.storePassword,
                        isActive: formData.isActive,
                        createdAt: Timestamp.now(),
                        updatedAt: Timestamp.now()
                    };

                    await setDoc(doc(window.db, 'stores', storeId), storeData);

                    // 初期テーブル設定を作成（テーブルはコピーしない）
                    const initialTables = [
                        { id: 'sokukaikei', name: '即会計', status: 'empty', order: null },
                        { id: 'takeout', name: 'テイクアウト', status: 'empty', order: null }
                    ];

                    await setDoc(doc(window.db, 'store_tables', storeId), {
                        tables: initialTables,
                        updatedAt: Timestamp.now()
                    });

                    // メニューのコピー処理
                    if (formData.createMode === 'copy') {
                        // コピー元のメニューを取得（新しい構造）
                        const sourceMenusRef = collection(window.db, 'stores', formData.sourceStoreId, 'menus');
                        const sourceMenusSnapshot = await getDocs(sourceMenusRef);
                        
                        let copiedMenuCount = 0;
                        if (!sourceMenusSnapshot.empty) {
                            // 新しい店舗にメニューをコピー
                            const copyPromises = [];
                            sourceMenusSnapshot.forEach((menuDoc) => {
                                const menuData = menuDoc.data();
                                const newMenuRef = doc(window.db, 'stores', storeId, 'menus', menuDoc.id);
                                copyPromises.push(setDoc(newMenuRef, menuData));
                            });
                            await Promise.all(copyPromises);
                            copiedMenuCount = sourceMenusSnapshot.size;
                            console.log(`✅ ${copiedMenuCount}件のメニューをコピーしました`);
                        } else {
                            console.log('⚠️ コピー元にメニューがありません');
                        }
                        
                        // トッピングのコピー処理
                        const sourceToppingsRef = collection(window.db, 'stores', formData.sourceStoreId, 'toppings');
                        const sourceToppingsSnapshot = await getDocs(sourceToppingsRef);
                        
                        let copiedToppingCount = 0;
                        if (!sourceToppingsSnapshot.empty) {
                            // 新しい店舗にトッピングをコピー
                            const toppingCopyPromises = [];
                            sourceToppingsSnapshot.forEach((toppingDoc) => {
                                const toppingData = toppingDoc.data();
                                const newToppingRef = doc(window.db, 'stores', storeId, 'toppings', toppingDoc.id);
                                toppingCopyPromises.push(setDoc(newToppingRef, toppingData));
                            });
                            await Promise.all(toppingCopyPromises);
                            copiedToppingCount = sourceToppingsSnapshot.size;
                            console.log(`✅ ${copiedToppingCount}件のトッピングをコピーしました`);
                        } else {
                            console.log('⚠️ コピー元にトッピングがありません');
                        }
                    }

                    showAlert('success', '完了', formData.createMode === 'copy' 
                        ? '店舗を追加し、メニューをコピーしました' 
                        : '店舗を追加しました');
                    setShowAddStore(false);
                    setFormData({ 
                        storeName: '', 
                        storePassword: '', 
                        isActive: true,
                        createMode: 'new',
                        sourceStoreId: ''
                    });
                } catch (error) {
                    console.error('店舗追加エラー:', error);
                    showAlert('error', 'エラー', '店舗の追加に失敗しました: ' + error.message);
                }
            };

            // 店舗編集
            const handleEditStore = async (e) => {
                e.preventDefault();
                
                if (!formData.storeName || !formData.storePassword) {
                    showAlert('warning', '入力エラー', '店舗名とパスワードを入力してください');
                    return;
                }

                try {
                    const { updateDoc, doc, Timestamp } = window.firebaseModules;
                    
                    // パスワードが変わったかチェック
                    const passwordChanged = editingStore.storePassword !== formData.storePassword;
                    
                    await updateDoc(doc(window.db, 'stores', editingStore.id), {
                        storeName: formData.storeName,
                        storePassword: formData.storePassword,
                        isActive: formData.isActive,
                        updatedAt: Timestamp.now(),
                        // 🆕 パスワード変更時はsessionVersionを更新→既存セッションを強制無効化
                        ...(passwordChanged && { sessionVersion: Date.now() })
                    });

                    showAlert('success', '完了', passwordChanged ? '店舗情報を更新しました。既存のログインセッションを無効化しました。' : '店舗情報を更新しました');
                    setEditingStore(null);
                    setFormData({ 
                        storeName: '', 
                        storePassword: '', 
                        isActive: true,
                        createMode: 'new',
                        sourceStoreId: ''
                    });
                } catch (error) {
                    console.error('店舗更新エラー:', error);
                    showAlert('error', 'エラー', '店舗情報の更新に失敗しました');
                }
            };

            // 🆕 他店舗からメニューをコピー
            const handleCopyFromStore = async (sourceStoreId) => {
                if (!editingStore) return;
                
                try {
                    const { doc, getDoc, setDoc, collection, getDocs } = window.firebaseModules;
                    
                    console.log('📋 コピー開始:', {
                        コピー元: sourceStoreId,
                        コピー先: editingStore.id
                    });
                    
                    // 1. menusコレクションをコピー
                    let sourceMenusRef;
                    if (sourceStoreId === '' || sourceStoreId === 'shimoakatsuka' || sourceStoreId === '下赤塚') {
                        // 下赤塚（ルートコレクション）- 旧データは'menu'
                        sourceMenusRef = collection(window.db, 'menu');
                        console.log('📍 コピー元: 旧パス menu コレクション');
                    } else {
                        sourceMenusRef = collection(window.db, 'stores', sourceStoreId, 'menus');
                        console.log('📍 コピー元: stores/' + sourceStoreId + '/menus');
                    }
                    
                    const menusSnapshot = await getDocs(sourceMenusRef);
                    console.log('📊 取得したメニュー数:', menusSnapshot.size);
                    
                    let copiedCount = 0;
                    for (const menuDoc of menusSnapshot.docs) {
                        const menuData = menuDoc.data();
                        console.log('📄 コピー中:', menuDoc.id, menuData);
                        
                        const targetMenuRef = doc(window.db, 'stores', editingStore.id, 'menus', menuDoc.id);
                        await setDoc(targetMenuRef, menuData);
                        copiedCount++;
                    }
                    
                    console.log(`✅ メニューをコピーしました: ${copiedCount}件`);
                    
                    // 2. menu_settings をコピー（カテゴリや設定）
                    let sourceMenuSettingsPath;
                    if (sourceStoreId === '' || sourceStoreId === 'shimoakatsuka' || sourceStoreId === '下赤塚') {
                        sourceMenuSettingsPath = doc(window.db, 'menu_settings', 'shimoakatsuka');
                        console.log('📍 設定コピー元: menu_settings/shimoakatsuka');
                    } else {
                        sourceMenuSettingsPath = doc(window.db, 'stores', sourceStoreId, 'menu_settings', 'default');
                        console.log('📍 設定コピー元: stores/' + sourceStoreId + '/menu_settings/default');
                    }
                    
                    const targetMenuSettingsPath = doc(window.db, 'stores', editingStore.id, 'menu_settings', 'default');
                    
                    const menuSettingsDoc = await getDoc(sourceMenuSettingsPath);
                    if (menuSettingsDoc.exists()) {
                        await setDoc(targetMenuSettingsPath, menuSettingsDoc.data());
                        console.log('✅ メニュー設定をコピーしました');
                    } else {
                        console.log('⚠️ メニュー設定が見つかりませんでした');
                    }
                    
                    // 3. toppingsコレクションをコピー
                    let sourceToppingsRef;
                    if (sourceStoreId === '' || sourceStoreId === 'shimoakatsuka' || sourceStoreId === '下赤塚') {
                        // 下赤塚（ルートコレクション）
                        sourceToppingsRef = collection(window.db, 'toppings');
                        console.log('📍 トッピングコピー元: toppings コレクション');
                    } else {
                        sourceToppingsRef = collection(window.db, 'stores', sourceStoreId, 'toppings');
                        console.log('📍 トッピングコピー元: stores/' + sourceStoreId + '/toppings');
                    }
                    
                    const toppingsSnapshot = await getDocs(sourceToppingsRef);
                    console.log('📊 取得したトッピング数:', toppingsSnapshot.size);
                    
                    let copiedToppingsCount = 0;
                    for (const toppingDoc of toppingsSnapshot.docs) {
                        const toppingData = toppingDoc.data();
                        console.log('🍕 トッピングコピー中:', toppingDoc.id, toppingData);
                        
                        const targetToppingRef = doc(window.db, 'stores', editingStore.id, 'toppings', toppingDoc.id);
                        await setDoc(targetToppingRef, toppingData);
                        copiedToppingsCount++;
                    }
                    
                    console.log(`✅ トッピングをコピーしました: ${copiedToppingsCount}件`);
                    
                    if (copiedCount === 0 && copiedToppingsCount === 0) {
                        showAlert('warning', '注意', 'コピーするメニューが見つかりませんでした。\nコピー元の店舗にメニューが登録されているか確認してください。');
                    } else {
                        showAlert('success', 'コピー完了', `メニューをコピーしました\n\n商品数: ${copiedCount}件\nトッピング数: ${copiedToppingsCount}件`);
                    }
                    
                } catch (error) {
                    console.error('コピーエラー:', error);
                    showAlert('error', 'エラー', 'コピーに失敗しました: ' + error.message);
                }
            };

            // 店舗削除
            const handleDeleteStore = (storeId, storeName) => {
                showConfirm(
                    '店舗削除',
                    `本当に「${storeName}」を削除しますか？\nこの操作は取り消せません。`,
                    async () => {
                        try {
                            const { deleteDoc, doc } = window.firebaseModules;
                            
                            await deleteDoc(doc(window.db, 'stores', storeId));
                            await deleteDoc(doc(window.db, 'store_tables', storeId));
                            await deleteDoc(doc(window.db, 'store_menus', storeId));

                            showAlert('success', '完了', '店舗を削除しました');
                        } catch (error) {
                            console.error('店舗削除エラー:', error);
                            showAlert('error', 'エラー', '店舗の削除に失敗しました');
                        }
                    }
                );
            };

            // 有効/無効切り替え
            const toggleStoreActive = async (storeId, currentStatus) => {
                try {
                    const { updateDoc, doc, Timestamp } = window.firebaseModules;
                    
                    await updateDoc(doc(window.db, 'stores', storeId), {
                        isActive: !currentStatus,
                        updatedAt: Timestamp.now()
                    });
                } catch (error) {
                    console.error('ステータス更新エラー:', error);
                    showAlert('error', 'エラー', 'ステータスの更新に失敗しました');
                }
            };
            
            // 日計表モーダルを開く
            const openDailyReportModal = (store) => {
                setSelectedStore(store);
                const now = new Date();
                setReportYear(now.getFullYear());
                setReportMonth(now.getMonth() + 1);
                setReportDay(now.getDate());
                setShowDailyReportModal(true);
            };
            
            // 日計表モーダルを閉じる
            const closeDailyReportModal = () => {
                setShowDailyReportModal(false);
                setSelectedStore(null);
            };
            
            // 日計表を生成（pos.htmlと同じ形式）
            const generateDailyReport = async () => {
                if (!selectedStore) return;
                
                try {
                    showAlert('info', '処理中', '日計表を生成しています...');
                    
                    const year = reportYear;
                    const month = reportMonth;
                    const endDay = reportDay; // 選択した日まで出力
                    
                    console.log(`📊 ${year}年${month}月1日〜${endDay}日の日計表を生成中...`);
                    
                    // Firestoreから当月のデータを取得
                    const { collection, getDocs, getDoc, doc } = window.firebaseModules;
                    const dailySalesRef = collection(window.db, 'stores', selectedStore.id, 'dailySales');
                    const dailySalesSnapshot = await getDocs(dailySalesRef);
                    
                    // 日付ごとにデータを整理
                    const salesByDate = {};
                    dailySalesSnapshot.forEach(docData => {
                        const data = docData.data();
                        const date = data.date;
                        
                        // 当月のデータのみ
                        if (date && date.startsWith(`${year}-${String(month).padStart(2, '0')}`)) {
                            salesByDate[date] = data;
                        }
                    });
                    
                    console.log('取得したデータ:', salesByDate);
                    
                    // Excelデータを作成
                    const excelData = [];
                    
                    // ヘッダー行1（タイトル）
                    excelData.push(['', '売上日計表', '', '', '', '', '', '', '', '', selectedStore.storeName, '', '', '']);
                    excelData.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '']);
                    excelData.push(['', `${year}-${String(month).padStart(2, '0')}-01`, '', '', '', '', '', '', '', '', '', '', '', '']);
                    excelData.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '']);
                    
                    // ヘッダー行2（列名）
                    excelData.push(['', '日', '曜日', '伝票数', '現金', 'カード', '電子マネー', '売上合計', '人件費', '人件費%', '支払い', '純売上', 'TOTAL粗利', '天気']);
                    
                    // 曜日配列
                    const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
                    
                    // 累計粗利
                    let totalGrossProfit = 0;
                    
                    // 合計用の変数
                    let sumCustomerCount = 0;
                    let sumCashSales = 0;
                    let sumCreditSales = 0;
                    let sumEmoneSales = 0;
                    let sumTotalSales = 0;
                    let sumLaborCost = 0;
                    let sumPayment = 0;
                    let sumNetSales = 0;
                    
                    // 各日のデータ（1日から選択した日まで）
                    for (let day = 1; day <= endDay; day++) {
                        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        const date = new Date(year, month - 1, day);
                        const weekDay = weekDays[date.getDay()];
                        
                        const data = salesByDate[dateStr];
                        
                        if (data) {
                            // データがある場合
                            const customerCount = data.customerCount || 0;
                            const cashSales = data.cashSales || 0;
                            const creditSales = data.creditSales || 0;
                            const emoneSales = data.emoneSales || 0;
                            const totalSales = cashSales + creditSales + emoneSales;
                            
                            // 人件費をattendanceから取得
                            let laborCost = 0;
                            try {
                                const attendanceRef = collection(window.db, 'stores', selectedStore.id, 'attendance');
                                const attendanceSnapshot = await getDocs(attendanceRef);
                                attendanceSnapshot.forEach(docData => {
                                    const attData = docData.data();
                                    if (attData.date === dateStr && attData.totalWage) {
                                        laborCost += attData.totalWage;
                                    }
                                });
                            } catch (e) {
                                console.error('人件費取得エラー:', e);
                            }
                            
                            const laborCostPercent = totalSales > 0 ? Math.round(laborCost / totalSales * 100) : 0;
                            
                            // 支出をexpensesから取得
                            let payment = 0;
                            try {
                                const expenseRef = doc(window.db, 'stores', selectedStore.id, 'expenses', dateStr);
                                const expenseDoc = await getDoc(expenseRef);
                                if (expenseDoc.exists()) {
                                    payment = expenseDoc.data().total || 0;
                                }
                            } catch (e) {
                                console.error('支出取得エラー:', e);
                            }
                            
                            // 純売上
                            const netSales = totalSales - laborCost - payment;
                            
                            // 累計粗利
                            totalGrossProfit += netSales;
                            
                            // 合計に加算
                            sumCustomerCount += customerCount;
                            sumCashSales += cashSales;
                            sumCreditSales += creditSales;
                            sumEmoneSales += emoneSales;
                            sumTotalSales += totalSales;
                            sumLaborCost += laborCost;
                            sumPayment += payment;
                            sumNetSales += netSales;
                            
                            excelData.push([
                                '',
                                day,
                                weekDay,
                                customerCount,
                                cashSales,
                                creditSales,
                                emoneSales,
                                totalSales,
                                Math.round(laborCost),
                                laborCostPercent + '%',
                                payment,
                                Math.round(netSales),
                                Math.round(totalGrossProfit),
                                ''
                            ]);
                        } else {
                            // データがない場合（空行）
                            excelData.push([
                                '',
                                day,
                                weekDay,
                                '', '', '', '', '', '', '', '', '', '', ''
                            ]);
                        }
                    }
                    
                    // 合計行を追加
                    const avgLaborCostPercent = sumTotalSales > 0 ? Math.round(sumLaborCost / sumTotalSales * 100) : 0;
                    excelData.push([
                        '',
                        '',
                        '合計',
                        sumCustomerCount,
                        sumCashSales,
                        sumCreditSales,
                        sumEmoneSales,
                        sumTotalSales,
                        Math.round(sumLaborCost),
                        avgLaborCostPercent + '%',
                        sumPayment,
                        Math.round(sumNetSales),
                        '',
                        ''
                    ]);
                    
                    console.log('Excelデータ作成完了:', excelData.length, '行');
                    
                    // SheetJSでExcelファイルを生成
                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.aoa_to_sheet(excelData);
                    
                    // 列幅を設定
                    ws['!cols'] = [
                        { wch: 3 },  // A列
                        { wch: 12 }, // B列（日）
                        { wch: 5 },  // C列（曜日）
                        { wch: 8 },  // D列（伝票数）
                        { wch: 10 }, // E列（現金）
                        { wch: 10 }, // F列（カード）
                        { wch: 12 }, // G列（電子マネー）
                        { wch: 12 }, // H列（売上合計）
                        { wch: 10 }, // I列（人件費）
                        { wch: 8 },  // J列（人件費%）
                        { wch: 10 }, // K列（支払い）
                        { wch: 10 }, // L列（純売上）
                        { wch: 12 }, // M列（TOTAL粗利）
                        { wch: 8 }   // N列（天気）
                    ];
                    
                    // スタイル設定
                    const range = XLSX.utils.decode_range(ws['!ref']);
                    
                    for (let R = range.s.r; R <= range.e.r; R++) {
                        for (let C = range.s.c; C <= range.e.c; C++) {
                            const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                            
                            // セルが存在しない場合は作成
                            if (!ws[cellAddress]) {
                                ws[cellAddress] = { t: 's', v: '' };
                            }
                            
                            // スタイルオブジェクトを初期化
                            if (!ws[cellAddress].s) {
                                ws[cellAddress].s = {};
                            }
                            
                            // 罫線を設定
                            ws[cellAddress].s.border = {
                                top: { style: 'thin', color: { rgb: '000000' } },
                                bottom: { style: 'thin', color: { rgb: '000000' } },
                                left: { style: 'thin', color: { rgb: '000000' } },
                                right: { style: 'thin', color: { rgb: '000000' } }
                            };
                            
                            // ヘッダー行（5行目 = R=4）のスタイル
                            if (R === 4) {
                                ws[cellAddress].s.fill = {
                                    patternType: 'solid',
                                    fgColor: { rgb: 'D3D3D3' }
                                };
                                ws[cellAddress].s.font = {
                                    bold: true,
                                    sz: 11
                                };
                                ws[cellAddress].s.alignment = {
                                    horizontal: 'center',
                                    vertical: 'center'
                                };
                            }
                            
                            // 合計行（最終行）のスタイル
                            if (R === range.e.r) {
                                ws[cellAddress].s.fill = {
                                    patternType: 'solid',
                                    fgColor: { rgb: 'FFFFCC' }
                                };
                                ws[cellAddress].s.font = {
                                    bold: true,
                                    sz: 11
                                };
                            }
                            
                            // 数値セルの右寄せ
                            if (C >= 3 && C <= 12 && R >= 5) {
                                if (!ws[cellAddress].s.alignment) {
                                    ws[cellAddress].s.alignment = {};
                                }
                                ws[cellAddress].s.alignment.horizontal = 'right';
                            }
                        }
                    }
                    
                    XLSX.utils.book_append_sheet(wb, ws, '売上日計表');
                    
                    const fileName = `${selectedStore.storeName}_日計表_${year}年${month}月1日〜${endDay}日.xlsx`;
                    XLSX.writeFile(wb, fileName);
                    
                    showAlert('success', '完了', `日計表を出力しました\n${fileName}`);
                    closeDailyReportModal();
                    
                } catch (error) {
                    console.error('日計表生成エラー:', error);
                    showAlert('error', 'エラー', '日計表の生成に失敗しました: ' + error.message);
                }

            // 編集開始

                                                キャンセル
                                            </button>
                                            <button
                                                type="submit"
                                                className="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3 rounded-lg font-bold hover:opacity-90 transition-all"
                                            >
                                                追加
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* 編集モーダル */}
                        {editingStore && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-6">店舗情報編集</h2>
                                    
                                    <form onSubmit={handleEditStore}>
                                        <div className="mb-4">
                                            <label className="block text-gray-700 text-sm font-bold mb-2">
                                                店舗名 *
                                            </label>
                                            <input
                                                type="text"
                                                value={formData.storeName}
                                                onChange={(e) => setFormData({...formData, storeName: e.target.value})}
                                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                                                required
                                            />
                                        </div>

                                        <div className="mb-4">
                                            <label className="block text-gray-700 text-sm font-bold mb-2">
                                                パスワード *
                                            </label>
                                            <div className="relative">
                                                <input
                                                    type="text"
                                                    value={formData.storePassword}
                                                    onChange={(e) => setFormData({...formData, storePassword: e.target.value})}
                                                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 font-mono"
                                                    required
                                                />
                                            </div>
                                            <div className="flex gap-2 mt-2">
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';
                                                        let password = '';
                                                        for (let i = 0; i < 16; i++) {
                                                            password += chars.charAt(Math.floor(Math.random() * chars.length));
                                                        }
                                                        setFormData({...formData, storePassword: password});
                                                        showAlert('success', '生成完了', '安全なパスワードを生成しました');
                                                    }}
                                                    className="flex-1 bg-gradient-to-r from-purple-500 to-purple-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:opacity-90 transition-all flex items-center justify-center gap-2"
                                                >
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
                                                    </svg>
                                                    ランダム生成
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        if (formData.storePassword) {
                                                            navigator.clipboard.writeText(formData.storePassword);
                                                            showAlert('success', 'コピー完了', 'パスワードをクリップボードにコピーしました');
                                                        } else {
                                                            showAlert('warning', 'エラー', 'コピーするパスワードがありません');
                                                        }
                                                    }}
                                                    className="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:opacity-90 transition-all flex items-center justify-center gap-2"
                                                >
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                                    </svg>
                                                    コピー
                                                </button>
                                            </div>
                                        </div>

                                        <div className="mb-6">
                                            <label className="flex items-center">
                                                <input
                                                    type="checkbox"
                                                    checked={formData.isActive}
                                                    onChange={(e) => setFormData({...formData, isActive: e.target.checked})}
                                                    className="w-5 h-5 text-blue-600"
                                                />
                                                <span className="ml-2 text-gray-700">アクティブにする</span>
                                            </label>
                                        </div>

                                        {/* 🆕 他店舗からコピーボタン */}
                                        <div className="mb-4 pb-4 border-b border-gray-200">
                                            <button
                                                type="button"
                                                onClick={() => setShowCopyDialog(true)}
                                                className="w-full bg-gradient-to-r from-purple-500 to-purple-600 text-white px-6 py-3 rounded-lg font-bold hover:opacity-90 transition-all flex items-center justify-center gap-2"
                                            >
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                                </svg>
                                                他店舗からメニューをコピー
                                            </button>
                                        </div>

                                        <div className="flex gap-3">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setEditingStore(null);
                                                    setFormData({ 
                                                        storeName: '', 
                                                        storePassword: '', 
                                                        isActive: true,
                                                        createMode: 'new',
                                                        sourceStoreId: ''
                                                    });
                                                }}
                                                className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-400 transition-all"
                                            >
                                                キャンセル
                                            </button>
                                            <button
                                                type="submit"
                                                className="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3 rounded-lg font-bold hover:opacity-90 transition-all"
                                            >
                                                更新
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* 🆕 コピー元選択ダイアログ */}
                        {showCopyDialog && (
                            <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-[60]">
                                <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-6">コピー元の店舗を選択</h2>
                                    
                                    <div className="space-y-2 mb-6 max-h-96 overflow-y-auto">
                                        {/* 下赤塚 */}
                                        <button
                                            onClick={async () => {
                                                setShowCopyDialog(false);
                                                await handleCopyFromStore('');
                                            }}
                                            className="w-full text-left px-4 py-3 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-all"
                                        >
                                            <div className="font-bold text-gray-800">下赤塚</div>
                                            <div className="text-sm text-gray-600">ルートコレクション</div>
                                        </button>
                                        
                                        {/* 他の店舗 */}
                                        {stores.filter(s => editingStore && s.id !== editingStore.id && s.id !== 'shimoakatsuka').map(store => (
                                            <button
                                                key={store.id}
                                                onClick={async () => {
                                                    setShowCopyDialog(false);
                                                    await handleCopyFromStore(store.id);
                                                }}
                                                className="w-full text-left px-4 py-3 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-all"
                                            >
                                                <div className="font-bold text-gray-800">{store.storeName}</div>
                                                <div className="text-sm text-gray-600">ID: {store.id}</div>
                                            </button>
                                        ))}
                                    </div>
                                    
                                    <button
                                        onClick={() => setShowCopyDialog(false)}
                                        className="w-full bg-gray-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-gray-600 transition-all"
                                    >
                                        キャンセル
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {/* カスタムモーダル */}
                    <CustomModal
                        isOpen={modal.isOpen}
                        onClose={() => setModal({ ...modal, isOpen: false })}
                        type={modal.type}
                        title={modal.title}
                        message={modal.message}
                    />
                    
                    {/* 確認モーダル */}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        onClose={() => setConfirmModal({ ...confirmModal, isOpen: false })}
                        onConfirm={confirmModal.onConfirm}
                        title={confirmModal.title}
                        message={confirmModal.message}
                    />

                    {/* 🆕 スーパー管理者パスワード変更モーダル */}
                    {showPasswordModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">🔑 管理者パスワード変更</h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">現在のパスワード</label>
                                        <input
                                            type="password"
                                            value={currentPasswordInput}
                                            onChange={(e) => setCurrentPasswordInput(e.target.value)}
                                            className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                                            placeholder="現在のパスワード"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">新しいパスワード</label>
                                        <input
                                            type="password"
                                            value={newSuperPassword}
                                            onChange={(e) => setNewSuperPassword(e.target.value)}
                                            className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                                            placeholder="8文字以上"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">新しいパスワード（確認）</label>
                                        <input
                                            type="password"
                                            value={confirmSuperPassword}
                                            onChange={(e) => setConfirmSuperPassword(e.target.value)}
                                            className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"
                                            placeholder="もう一度入力"
                                        />
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-6">
                                    <button
                                        onClick={handleChangeSuperPassword}
                                        className="flex-1 bg-purple-600 text-white py-3 rounded-lg font-bold hover:opacity-90"
                                    >変更する</button>
                                    <button
                                        onClick={() => { setShowPasswordModal(false); setCurrentPasswordInput(''); setNewSuperPassword(''); setConfirmSuperPassword(''); }}
                                        className="flex-1 bg-gray-500 text-white py-3 rounded-lg font-bold hover:opacity-90"
                                    >キャンセル</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* 日計表出力モーダル */}
                    {showDailyReportModal && selectedStore && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">📊 日計表出力</h2>
                                
                                <div className="mb-6">
                                    <p className="text-gray-700 mb-4">
                                        <span className="font-bold text-lg">{selectedStore.storeName}</span>
                                    </p>
                                    <p className="text-sm text-gray-600 mb-2">出力する月と最終日を選択してください</p>
                                    <p className="text-xs text-blue-600 mb-4">※ 1日から選択した日までのデータを出力します</p>
                                    
                                    <div className="grid grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">年</label>
                                            <select
                                                value={reportYear}
                                                onChange={(e) => setReportYear(parseInt(e.target.value))}
                                                className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                                            >
                                                {[...Array(5)].map((_, i) => {
                                                    const year = new Date().getFullYear() - i;
                                                    return <option key={year} value={year}>{year}年</option>;
                                                })}
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">月</label>
                                            <select
                                                value={reportMonth}
                                                onChange={(e) => setReportMonth(parseInt(e.target.value))}
                                                className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                                            >
                                                {[...Array(12)].map((_, i) => (
                                                    <option key={i + 1} value={i + 1}>{i + 1}月</option>
                                                ))}
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">日</label>
                                            <select
                                                value={reportDay}
                                                onChange={(e) => setReportDay(parseInt(e.target.value))}
                                                className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                                            >
                                                {[...Array(31)].map((_, i) => (
                                                    <option key={i + 1} value={i + 1}>{i + 1}日</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="flex gap-3">
                                    <button
                                        onClick={closeDailyReportModal}
                                        className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-400 transition-all"
                                    >
                                        キャンセル
                                    </button>
                                    <button
                                        onClick={generateDailyReport}
                                        className="flex-1 bg-gradient-to-r from-green-500 to-green-600 text-white py-3 rounded-lg font-bold hover:opacity-90 transition-all"
                                    >
                                        出力
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<SuperAdminSystem />, document.getElementById('root'));
    </script>
</body>
</html>
