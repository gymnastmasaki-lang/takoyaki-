<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>レシート・領収書表示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
    }
    
    .header p {
      font-size: 14px;
      color: #666;
    }
    
    .receipt-content {
      margin: 30px 0;
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 20px;
      background: #fafafa;
    }
    
    .error-message {
      text-align: center;
      padding: 40px;
      color: #f44336;
      font-size: 18px;
      font-weight: bold;
    }
    
    .loading-message {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 18px;
      font-weight: bold;
    }
    
    .download-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s;
    }
    
    .download-btn:hover {
      transform: translateY(-2px);
    }
    
    .download-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="receiptDisplay" class="receipt-content">
      <div class="loading-message">読み込み中...</div>
    </div>
    
    <button id="downloadBtn" class="download-btn" style="display: none;" onclick="downloadImage()">
      画像をダウンロード
    </button>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBVrGE2p8mZs2cF5YqXxV8yqD4Z9K0v7k8",
      authDomain: "takoyaki-order-system-bacd7.firebaseapp.com",
      projectId: "takoyaki-order-system-bacd7",
      storageBucket: "takoyaki-order-system-bacd7.firebasestorage.app",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    signInAnonymously(auth).catch(e => console.error('❌ 匿名認証に失敗しました:', e));

    console.log('🚀 Firebase初期化完了');

    // URLパラメータ取得
    const urlParams = new URLSearchParams(window.location.search);
    const receiptId = urlParams.get('id');

    console.log('🆔 レシートID:', receiptId);

    const displayDiv = document.getElementById('receiptDisplay');
    const downloadBtn = document.getElementById('downloadBtn');
    let receiptImageData = null;

    // レシート読み込み関数
    async function loadReceipt() {
      console.log('📄 === レシート読み込み開始 ===');

      if (!receiptId) {
        displayDiv.innerHTML = '<div class="error-message">レシートIDが指定されていません</div>';
        console.error('❌ レシートIDがありません');
        return;
      }

      try {
        // Firestoreからレシートデータを取得
        console.log('💾 Firestoreからデータ取得:', receiptId);
        const receiptRef = doc(db, 'receipt_images', receiptId);
        const receiptDoc = await getDoc(receiptRef);

        if (!receiptDoc.exists()) {
          displayDiv.innerHTML = `
            <div class="error-message">
              レシート・領収書が見つかりません<br><br>
              <small>QRコードの有効期限が切れているか、データが削除された可能性があります</small>
            </div>
          `;
          console.error('❌ ドキュメントが存在しません');
          return;
        }

        const data = receiptDoc.data();
        receiptImageData = data.imageData;

        // 有効期限チェック
        const expiresAt = data.expiresAt?.toDate();
        if (expiresAt && expiresAt < new Date()) {
          displayDiv.innerHTML = `
            <div class="error-message">
              このレシートの有効期限が切れています<br><br>
              <small>レシートは発行から7日間有効です</small>
            </div>
          `;
          console.warn('⚠️ レシートの有効期限切れ');
          return;
        }

        console.log('✅ データ取得成功');
        console.log('📊 注文番号:', data.orderNumber);
        console.log('💰 合計:', data.total);

        // 画像を表示
        displayDiv.innerHTML = '';

        const img = document.createElement('img');
        img.src = receiptImageData;
        img.style.width = '100%';
        img.style.borderRadius = '8px';

        img.onload = function() {
          console.log('✅ 画像読み込み成功');
          console.log('📏 画像サイズ:', img.naturalWidth, 'x', img.naturalHeight);
        };

        img.onerror = function() {
          console.error('❌ 画像読み込みエラー');
          displayDiv.innerHTML = '<div class="error-message">画像の読み込みに失敗しました</div>';
        };

        displayDiv.appendChild(img);
        downloadBtn.style.display = 'block';

        console.log('✅ レシート表示完了');

      } catch (error) {
        console.error('❌ エラー:', error);
        displayDiv.innerHTML = `
          <div class="error-message">
            データの読み込みに失敗しました<br><br>
            <small>${error.message}</small>
          </div>
        `;
      }
    }

    // ダウンロード関数
    window.downloadImage = function() {
      if (!receiptImageData) {
        alert('画像データがありません');
        return;
      }

      const link = document.createElement('a');
      link.download = `receipt_${receiptId}.png`;
      link.href = receiptImageData;
      link.click();

      console.log('📥 画像ダウンロード実行');
    };

    // ページ読み込み時に実行
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadReceipt);
    } else {
      loadReceipt();
    }
  </script>
</body>
</html>
