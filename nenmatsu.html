": [360000, 240000, 120000]}, {"spouseUpTo": 1050000, "amounts": [310000, 210000, 110000]}, {"spouseUpTo": 1100000, "amounts": [260000, 180000, 90000]}, {"spouseUpTo": 1150000, "amounts": [210000, 140000, 70000]}, {"spouseUpTo": 1200000, "amounts": [160000, 110000, 60000]}, {"spouseUpTo": 1250000, "amounts": [110000, 80000, 40000]}, {"spouseUpTo": 1300000, "amounts": [60000, 40000, 20000]}, {"spouseUpTo": 1330000, "amounts": [30000, 20000, 10000]}], "eligibleIncomeMax": 580000}}, "2026": {"label": "令和8・9年分", "validFrom": 2026, "validThrough": 2027, "note": "令和8年度税制改正（基礎控除最大104万円・給与所得控除の最低保障74万円・扶養等の所得要件62万円）。令和10年分以後は別途改正あり", "salaryDeduction": [{"upTo": 2200000, "rate": 0, "add": 740000}, {"upTo": 3600000, "rate": 0.3, "add": 80000}, {"upTo": 6600000, "rate": 0.2, "add": 440000}, {"upTo": 8500000, "rate": 0.1, "add": 1100000}, {"upTo": null, "rate": 0, "add": 1950000}], "basicDeduction": [{"upTo": 4890000, "amount": 1040000}, {"upTo": 6550000, "amount": 670000}, {"upTo": 23500000, "amount": 620000}, {"upTo": 24000000, "amount": 480000}, {"upTo": 24500000, "amount": 320000}, {"upTo": 25000000, "amount": 160000}, {"upTo": null, "amount": 0}], "dependent": [{"minAge": 16, "maxAge": 18, "amount": 380000, "name": "一般"}, {"minAge": 19, "maxAge": 22, "amount": 630000, "name": "特定"}, {"minAge": 23, "maxAge": 69, "amount": 380000, "name": "一般"}, {"minAge": 70, "maxAge": 200, "amount": 480000, "name": "老人"}], "incomeTax": [{"upTo": 1950000, "rate": 0.05, "deduct": 0}, {"upTo": 3300000, "rate": 0.1, "deduct": 97500}, {"upTo": 6950000, "rate": 0.2, "deduct": 427500}, {"upTo": 9000000, "rate": 0.23, "deduct": 636000}, {"upTo": 18000000, "rate": 0.33, "deduct": 1536000}, {"upTo": 40000000, "rate": 0.4, "deduct": 2796000}, {"upTo": null, "rate": 0.45, "deduct": 4796000}], "reconstructionRate": 0.021, "blueDeduction": {"simple": 100000, "double": 650000}, "spouse": {"mainIncomeMax": 10000000, "deductionByMain": [{"mainUpTo": 9000000, "amount": 380000}, {"mainUpTo": 9500000, "amount": 260000}, {"mainUpTo": 10000000, "amount": 130000}], "specialSpouseMax": 1330000, "specialRows": [{"spouseUpTo": 950000, "amounts": [380000, 260000, 130000]}, {"spouseUpTo": 1000000, "amounts": [360000, 240000, 120000]}, {"spouseUpTo": 1050000, "amounts": [310000, 210000, 110000]}, {"spouseUpTo": 1100000, "amounts": [260000, 180000, 90000]}, {"spouseUpTo": 1150000, "amounts": [210000, 140000, 70000]}, {"spouseUpTo": 1200000, "amounts": [160000, 110000, 60000]}, {"spouseUpTo": 1250000, "amounts": [110000, 80000, 40000]}, {"spouseUpTo": 1300000, "amounts": [60000, 40000, 20000]}, {"spouseUpTo": 1330000, "amounts": [30000, 20000, 10000]}], "eligibleIncomeMax": 620000}}}};
        window.__validTaxLaw = function (j) {
            try {
                if (!j || typeof j.version !== 'string' || !j.years || typeof j.years !== 'object') return false;
                const ks = Object.keys(j.years);
                if (!ks.length) return false;
                return ks.every(k => {
                    const y = j.years[k];
                    return /^\d{4}$/.test(k) && y && Array.isArray(y.salaryDeduction) && Array.isArray(y.basicDeduction) &&
                        Array.isArray(y.dependent) && Array.isArray(y.incomeTax) && y.spouse && Array.isArray(y.spouse.specialRows) &&
                        typeof y.reconstructionRate === 'number';
                });
            } catch (e) { return false; }
        };
        window.__taxLaw = __TAX_LAW_DEFAULT;
        window.loadTaxLaw = async function () {
            try {
                const r = await fetch('tax_law.json?ts=' + Date.now(), { cache: 'no-store' });
                if (r.ok) {
                    const j = await r.json();
                    if (window.__validTaxLaw(j)) {
                        if (String(j.version) >= String(__TAX_LAW_DEFAULT.version)) window.__taxLaw = j;
                        console.log('税制データ tax_law.json を使用します version=' + window.__taxLaw.version);
                        return window.__taxLaw;
                    }
                    console.warn('tax_law.json の形式が正しくないため、内蔵の税制データを使います');
                }
            } catch (e) { console.warn('tax_law.json を読めないため、内蔵の税制データを使います', e); }
            window.__taxLaw = __TAX_LAW_DEFAULT;
            return window.__taxLaw;
        };
        // 指定した年分に当てはまる税制を返す。登録のない年分は、直近の登録年の数値で計算して画面下に注意を出す
        window.getTaxLaw = function (year) {
            const years = window.__taxLaw.years;
            const keys = Object.keys(years).map(Number).sort((a, b) => a - b);
            let pick = keys[0];
            for (const k of keys) { if (k <= year) pick = k; }
            const law = years[String(pick)];
            const through = law.validThrough == null ? Infinity : law.validThrough;
            const exact = year >= (law.validFrom || pick) && year <= through;
            if (!exact && !window['__taxWarned' + year]) {
                window['__taxWarned' + year] = true;
                const bar = document.createElement('div');
                bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff3cd;color:#664d03;border-top:2px solid #ffca2c;padding:10px 16px;font-size:14px;text-align:center';
                bar.textContent = '⚠ ' + year + '年分の税制はまだ登録されていません。' + (law.label || pick) + 'の数値で計算しています（最新の税制と異なる可能性があります）。';
                bar.onclick = () => bar.remove();
                (document.body || document.documentElement).appendChild(bar);
            }
            return { law, key: pick, exact };
        };
        const __pick = (tiers, v, field) => { for (const t of tiers) { if (t.upTo === null || t.upTo === undefined || v <= t.upTo) return t; } return tiers[tiers.length - 1]; };
        window.TaxCalc = {
            salaryDeduction(law, income) { const t = __pick(law.salaryDeduction, income); return Math.floor(income * t.rate + t.add + 1e-6); },
            basicDeduction(law, income) { return __pick(law.basicDeduction, income).amount; },
            spouseDeduction(law, mainIncome, spouseIncome) {
                const s = law.spouse;
                if (mainIncome > s.mainIncomeMax || spouseIncome > s.eligibleIncomeMax) return 0;
                const t = s.deductionByMain.find(x => mainIncome <= x.mainUpTo);
                return t ? t.amount : 0;
            },
            spouseSpecialDeduction(law, mainIncome, spouseIncome) {
                const s = law.spouse;
                if (spouseIncome <= s.eligibleIncomeMax || spouseIncome > s.specialSpouseMax || mainIncome > s.mainIncomeMax) return 0;
                const row = s.specialRows.find(r => spouseIncome <= r.spouseUpTo);
                if (!row) return 0;
                const idx = mainIncome <= 9000000 ? 0 : (mainIncome <= 9500000 ? 1 : 2);
                return row.amounts[idx] || 0;
            },
            dependentDeduction(law, dependents) {
                let total = 0;
                (dependents || []).forEach(d => { const b = law.dependent.find(x => d.age >= x.minAge && d.age <= x.maxAge); if (b) total += b.amount; });
                return total;
            },
            incomeTax(law, taxable) { const t = __pick(law.incomeTax, taxable); return taxable * t.rate - t.deduct; },
            reconstruction(law, tax) { return Math.floor(tax * law.reconstructionRate); }
        };
        // ===== ここまで =====

        class NenmatsuCalculator {
            constructor(yearData) {
                this.yearData = yearData;
                this.year = yearData.year || new Date().getFullYear();
            }

            // 🆕 対象年分の税制（tax_law.json）
            law() { return window.getTaxLaw(this.year).law; }

            // 給与収入合計
            getTotalIncome() {
                return this.yearData.totalIncome || 0;
            }

            // 給与所得控除
            getIncomeDeduction() {
                return window.TaxCalc.salaryDeduction(this.law(), this.getTotalIncome());
            }

            // 給与所得
            getTaxableIncome() {
                return this.getTotalIncome() - this.getIncomeDeduction();
            }

            // 基礎控除（2020年改正後）
            getBasicDeduction() {
                return window.TaxCalc.basicDeduction(this.law(), this.getTaxableIncome());
            }

            // 配偶者控除
            getSpouseDeduction(spouseIncome) {
                if (spouseIncome === undefined || spouseIncome === null) return 0; // 🆕 配偶者なしは控除なし（以前は所得0円の配偶者がいる扱いで38万円が入っていた）
                return window.TaxCalc.spouseDeduction(this.law(), this.getTaxableIncome(), spouseIncome);
            }

            // 配偶者特別控除
            getSpouseSpecialDeduction(spouseIncome) {
                if (spouseIncome === undefined || spouseIncome === null) return 0;
                return window.TaxCalc.spouseSpecialDeduction(this.law(), this.getTaxableIncome(), spouseIncome);
            }

            // 扶養控除
            getDependentDeduction(dependents = []) {
                return window.TaxCalc.dependentDeduction(this.law(), dependents);
            }

            // 生命保険料控除
            getLifeInsuranceDeduction(data = {}) {
                const calc = (amount) => {
                    if (amount <= 20000) return amount;
                    if (amount <= 40000) return amount * 0.5 + 10000;
                    if (amount <= 80000) return amount * 0.25 + 20000;
                    return 40000;
                };
                
                const lifeIns = calc(data.lifeInsurance || 0);
                const medicalIns = calc(data.medicalInsurance || 0);
                const pensionIns = calc(data.pensionInsurance || 0);
                
                return Math.min(lifeIns + medicalIns + pensionIns, 120000);
            }

            // 地震保険料控除
            getEarthquakeInsuranceDeduction(amount = 0) {
                return Math.min(amount, 50000);
            }

            // 社会保険料控除
            getSocialInsuranceDeduction() {
                return this.yearData.totalSocialInsurance || 0;
            }

            // 小規模企業共済等掛金控除
            getSmallBusinessDeduction(amount = 0) {
                return amount;
            }

            // 所得控除合計
            getTotalDeductions(deductions = {}) {
                return this.getBasicDeduction() +
                       this.getSpouseDeduction(deductions.spouseIncome) +
                       this.getSpouseSpecialDeduction(deductions.spouseIncome) +
                       this.getDependentDeduction(deductions.dependents) +
                       this.getLifeInsuranceDeduction(deductions.lifeInsurance) +
                       this.getEarthquakeInsuranceDeduction(deductions.earthquakeInsurance) +
                       this.getSocialInsuranceDeduction() +
                       this.getSmallBusinessDeduction(deductions.smallBusiness);
            }

            // 課税所得
            getTaxableIncomeAfterDeductions(deductions = {}) {
                return Math.max(0, this.getTaxableIncome() - this.getTotalDeductions(deductions));
            }

            // 所得税額
            getIncomeTax(deductions = {}) {
                const taxable = this.getTaxableIncomeAfterDeductions(deductions);
                return window.TaxCalc.incomeTax(this.law(), taxable);
            }

            // 復興特別所得税
            getReconstructionTax(deductions = {}) {
                return window.TaxCalc.reconstruction(this.law(), this.getIncomeTax(deductions));
            }

            // 年調税額合計
            getTotalTax(deductions = {}) {
                return Math.floor(this.getIncomeTax(deductions)) + this.getReconstructionTax(deductions);
            }

            // 年末調整額（還付・追徴）
            getAdjustmentAmount(deductions = {}) {
                const totalTax = this.getTotalTax(deductions);
                const withheld = this.yearData.totalWithholdingTax || 0;
                return withheld - totalTax;
            }
        }

        const app = document.getElementById('app');

        async function loadEmployees() {
            const { collection, getDocs } = window.firebaseModules;
            
            console.log('🔍 現在のcurrentStoreId:', window.currentStoreId, '(型:', typeof window.currentStoreId, ')');
            console.log('🔍 currentStoreName:', window.currentStoreName);
            
            // 🔧 下赤塚店の場合はルートコレクションから読み込み
            let empRef;
            if (!window.currentStoreId || window.currentStoreId === '' || window.currentStoreName === '下赤塚') {
                console.log('✅ 下赤塚店（IDなし）: ルートパスで従業員を取得 (kintai_employees/)');
                empRef = collection(window.db, 'kintai_employees');
            } else {
                console.log('⚠️ 店舗ID使用: stores/' + window.currentStoreId + '/employees');
                empRef = collection(window.db, 'stores', window.currentStoreId, 'employees');
            }
            
            const snapshot = await getDocs(empRef);
            
            employees = [];
            snapshot.forEach(doc => {
                employees.push({ id: doc.id, ...doc.data() });
            });
            
            // sortOrderでソート（sortOrderがない場合は名前順）
            employees.sort((a, b) => {
                if (a.sortOrder !== undefined && b.sortOrder !== undefined) {
                    return a.sortOrder - b.sortOrder;
                }
                if (a.sortOrder !== undefined) return -1;
                if (b.sortOrder !== undefined) return 1;
                return (a.name || '').localeCompare(b.name || '');
            });
            
            console.log('従業員データ読み込み完了:', employees.length + '名');
        }

        async function loadYearData(employeeId, year) {
            // 年間給与データを集計
            const { collection, getDocs } = window.firebaseModules;
            
            const employee = employees.find(e => e.id === employeeId);
            if (!employee) return null;

            // 勤怠データを取得
            let totalIncome = 0;
            let totalSocialInsurance = 0;
            let totalWithholdingTax = 0;
            const monthlyData = [];

            // 🔧 下赤塚店の場合はルートコレクションから読み込み
            let attRef;
            if (!window.currentStoreId || window.currentStoreId === '' || window.currentStoreName === '下赤塚') {
                console.log('✅ 下赤塚店（IDなし）: ルートパスで勤怠を取得 (kintai_attendance/)');
                attRef = collection(window.db, 'kintai_attendance');
            } else {
                console.log('⚠️ 店舗ID使用: stores/' + window.currentStoreId + '/attendance');
                attRef = collection(window.db, 'stores', window.currentStoreId, 'attendance');
            }
            
            const snapshot = await getDocs(attRef);
            
            console.log('🔍 勤怠データ読み込み:', snapshot.size, '件のドキュメント');
            
            // 🔧 月別に集計
            for (let month = 0; month < 12; month++) {
                const yearMonth = `${year}-${String(month + 1).padStart(2, '0')}`;
                
                let monthlyHours = 0;
                let monthlyIncome = 0;
                let monthlyInsurance = 0;
                let monthlyTax = 0;
                
                snapshot.forEach(doc => {
                    const docId = doc.id; // ドキュメントID（{employeeId}_{yyyy-MM-dd}形式）
                    const data = doc.data();
                    
                    // 🔧 新形式: ドキュメントIDが{employeeId}_{date}形式
                    // 例: "emp001_2023-10-15"
                    const parts = docId.split('_');
                    if (parts.length >= 2) {
                        const docEmployeeId = parts[0];
                        const docDate = parts.slice(1).join('_'); // dateが"2023-10-15"のような形式
                        
                        // 対象従業員かつ対象年月のデータか確認
                        if (docEmployeeId === employeeId && docDate.startsWith(yearMonth)) {
                            console.log('✅ マッチ:', docId, docDate);
                            
                            // 🔧 給与計算（時間給 or 固定給）
                            if (employee.salaryType === '固定給') {
                                // 固定給の場合：月給を12で割って日割り
                                const monthlySalary = employee.monthlySalary || 0;
                                const daysInMonth = new Date(year, month + 1, 0).getDate();
                                
                                // 勤務した場合のみ日割り給与を加算
                                if (data.clockIn || data.status === '出勤') {
                                    monthlyIncome += Math.floor(monthlySalary / daysInMonth);
                                }
                            } else {
                                // 時間給の場合：勤務時間 × 時給
                                if (data.clockIn && data.clockOut) {
                                    const parseTime = (timeStr) => {
                                        const [hours, minutes] = timeStr.split(':').map(Number);
                                        return hours + minutes / 60;
                                    };
                                    
                                    let workHours = parseTime(data.clockOut) - parseTime(data.clockIn);
                                    
                                    // 休憩時間を引く
                                    if (data.breakStart1 && data.breakEnd1) {
                                        const breakHours = parseTime(data.breakEnd1) - parseTime(data.breakStart1);
                                        workHours -= breakHours;
                                    }
                                    if (data.breakStart2 && data.breakEnd2) {
                                        const breakHours = parseTime(data.breakEnd2) - parseTime(data.breakStart2);
                                        workHours -= breakHours;
                                    }
                                    
                                    workHours = Math.max(0, workHours);
                                    monthlyHours += workHours;
                                    
                                    const hourlyWage = employee.hourlyWage || employee.defaultHourlyWage || employee.hourlyRate || 1000;
                                    monthlyIncome += Math.floor(workHours * hourlyWage);
                                }
                            }
                            
                            // 🔧 社会保険料と源泉徴収税をdataから取得
                            if (data.socialInsurance) {
                                monthlyInsurance += data.socialInsurance;
                            }
                            if (data.withholdingTax) {
                                monthlyTax += data.withholdingTax;
                            }
                        }
                    }
                    // 🔧 旧形式のフォールバック（念のため）
                    else if (docId.startsWith(yearMonth)) {
                        // 旧形式: ドキュメントIDが日付のみ（yyyy-MM-dd形式）
                        const date = docId;
                        
                        // 従業員データを確認
                        if (data.employees && data.employees[employeeId]) {
                            const empData = data.employees[employeeId];
                            
                            // 🔧 給与計算（時間給 or 固定給）
                            if (employee.salaryType === '固定給') {
                                // 固定給の場合：月給を12で割って日割り
                                const monthlySalary = employee.monthlySalary || 0;
                                const daysInMonth = new Date(year, month + 1, 0).getDate();
                                
                                // 勤務した場合のみ日割り給与を加算
                                if (empData.clockIn || empData.status === '出勤') {
                                    monthlyIncome += Math.floor(monthlySalary / daysInMonth);
                                }
                            } else {
                                // 時間給の場合：勤務時間 × 時給
                                if (empData.clockIn && empData.clockOut) {
                                    const parseTime = (timeStr) => {
                                        const [hours, minutes] = timeStr.split(':').map(Number);
                                        return hours + minutes / 60;
                                    };
                                    
                                    let workHours = parseTime(empData.clockOut) - parseTime(empData.clockIn);
                                    
                                    // 休憩時間を引く
                                    if (empData.breakStart1 && empData.breakEnd1) {
                                        const breakHours = parseTime(empData.breakEnd1) - parseTime(empData.breakStart1);
                                        workHours -= breakHours;
                                    }
                                    if (empData.breakStart2 && empData.breakEnd2) {
                                        const breakHours = parseTime(empData.breakEnd2) - parseTime(empData.breakStart2);
                                        workHours -= breakHours;
                                    }
                                    
                                    workHours = Math.max(0, workHours);
                                    monthlyHours += workHours;
                                    
                                    const hourlyWage = employee.hourlyWage || employee.defaultHourlyWage || 1000;
                                    monthlyIncome += Math.floor(workHours * hourlyWage);
                                }
                            }
                            
                            // 🔧 社会保険料と源泉徴収税をempDataから取得
                            if (empData.socialInsurance) {
                                monthlyInsurance += empData.socialInsurance;
                            }
                            if (empData.withholdingTax) {
                                monthlyTax += empData.withholdingTax;
                            }
                        }
                    }
                });
                
                totalIncome += monthlyIncome;
                totalSocialInsurance += monthlyInsurance;
                totalWithholdingTax += monthlyTax;
                
                monthlyData.push({
                    month: month + 1,
                    income: monthlyIncome,
                    hours: Math.round(monthlyHours * 10) / 10,
                    insurance: monthlyInsurance,
                    tax: monthlyTax
                });
            }
            
            console.log('年間データ集計完了:', {
                year: year,
                employeeId: employeeId,
                employeeName: employee.name,
                salaryType: employee.salaryType,
                totalIncome: totalIncome,
                totalSocialInsurance: totalSocialInsurance,
                totalWithholdingTax: totalWithholdingTax
            });
            
            return {
                year: year,
                totalIncome: totalIncome,
                totalSocialInsurance: totalSocialInsurance,
                totalWithholdingTax: totalWithholdingTax,
                monthlyData: monthlyData
            };
        }

                        </div>
                        <div class="p-4 bg-white rounded-lg shadow">
                            <div class="text-sm text-gray-600">地震保険料控除</div>
                            <div class="text-xl font-bold">¥${calculator.getEarthquakeInsuranceDeduction(deductions.earthquakeInsurance).toLocaleString()}</div>
                        </div>
                        <div class="p-4 bg-white rounded-lg shadow">
                            <div class="text-sm text-gray-600">社会保険料控除</div>
                            <div class="text-xl font-bold">¥${calculator.getSocialInsuranceDeduction().toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="p-4 bg-white rounded-lg shadow mb-6">
                        <div class="text-sm text-gray-600">所得控除合計</div>
                        <div class="text-2xl font-bold text-blue-600">¥${totalDeductions.toLocaleString()}</div>
                    </div>

                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="p-4 bg-white rounded-lg shadow">
                            <div class="text-sm text-gray-600">課税所得</div>
                            <div class="text-xl font-bold">¥${taxableIncome.toLocaleString()}</div>
                        </div>
                        <div class="p-4 bg-white rounded-lg shadow">
                            <div class="text-sm text-gray-600">所得税額</div>
                            <div class="text-xl font-bold">¥${Math.floor(incomeTax).toLocaleString()}</div>
                        </div>
                        <div class="p-4 bg-white rounded-lg shadow">
                            <div class="text-sm text-gray-600">復興特別所得税</div>
                            <div class="text-xl font-bold">¥${reconstructionTax.toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="p-6 bg-white rounded-lg shadow-lg">
                        <div class="text-center mb-2">
                            <div class="text-lg text-gray-600">年末調整${adjustment >= 0 ? '還付' : '追加徴収'}額</div>
                            <div class="text-4xl font-bold ${adjustment >= 0 ? 'text-green-600' : 'text-red-600'}">
                                ${adjustment >= 0 ? '+' : ''}¥${Math.floor(adjustment).toLocaleString()}
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex gap-4">
                        <button onclick="downloadPDF()" class="flex-1 px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 font-bold">
                            源泉徴収票をPDF出力
                        </button>
                        <button onclick="downloadCSV()" class="flex-1 px-6 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 font-bold">
                            e-Tax用CSVダウンロード
                        </button>
                    </div>
                </div>
            `;
        };

        window.downloadPDF = function() {
            alert('源泉徴収票PDF機能は準備中です。\n\nブラウザの印刷機能で代用できます。');
            window.print();
        };

        window.downloadCSV = function() {
            const emp = employees.find(e => e.id === selectedEmployee);
            const calculator = new NenmatsuCalculator(yearData);
            
            const csv = [
                ['年度', '氏名', 'フリガナ', '給与収入', '給与所得', '所得控除合計', '課税所得', '所得税額', '還付・徴収額'],
                [
                    targetYear,
                    emp.name,
                    emp.furigana,
                    calculator.getTotalIncome(),
                    calculator.getTaxableIncome(),
                    calculator.getTotalDeductions(deductions),
                    calculator.getTaxableIncomeAfterDeductions(deductions),
                    Math.floor(calculator.getTotalTax(deductions)),
                    Math.floor(calculator.getAdjustmentAmount(deductions))
                ]
            ].map(row => row.join(',')).join('\n');
            
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `年末調整_${emp.name}_${targetYear}.csv`;
            a.click();
        };

        init();
    </script>
</body>
</html>
